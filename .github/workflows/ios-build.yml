name: ios-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Download project parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p parts
          gh release download v1 --repo "${{ github.repository }}" --pattern 'part*' --dir parts
          ls parts | head -5
          ls parts | wc -l
          cat parts/part* > RedPoker_iOS.tar.gz
          ls -la RedPoker_iOS.tar.gz
          mkdir -p proj
          tar -xzf RedPoker_iOS.tar.gz -C proj
          ls proj | head -30

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/proj"
          xcodebuild -project Unity-iPhone.xcodeproj \
            -target Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -100

      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Unity-iPhone.app"
          ls -la "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/" || true
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
          cd "$GITHUB_WORKSPACE/out"
          zip -qry RedPoker.ipa Payload
          ls -la RedPoker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RedPoker-ipa
          path: out/RedPoker.ipa
          if-no-files-found: error
