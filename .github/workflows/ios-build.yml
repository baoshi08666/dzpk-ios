name: ios-build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Download project parts
        run: |
          set -e
          EXPECTED=396909461
          BASE="https://github.com/${{ github.repository }}/releases/download/v1"
          rm -rf parts RedPoker_iOS.tar.gz
          mkdir -p parts
          for i in $(seq 0 75); do
            n=$(printf "%03d" $i)
            for attempt in 1 2 3 4 5; do
              curl -sSfL --retry 3 --retry-delay 2 -o "parts/part$n" "$BASE/part$n" && break
              echo "retry part$n ($attempt)"
              sleep 3
            done
            [ -s "parts/part$n" ] || { echo "missing part$n"; exit 1; }
          done
          n=$(ls parts | wc -l | tr -d ' ')
          echo "parts=$n"
          [ "$n" -eq 76 ] || { echo "wrong part count"; exit 1; }
          cat parts/part* > RedPoker_iOS.tar.gz
          size=$(wc -c < RedPoker_iOS.tar.gz | tr -d ' ')
          echo "archive size=$size expected=$EXPECTED"
          [ "$size" -eq "$EXPECTED" ] || { echo "size mismatch"; exit 1; }
          mkdir -p proj
          tar -xzf RedPoker_iOS.tar.gz -C proj
          ls proj | head -30

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/proj"
          xcodebuild -project Unity-iPhone.xcodeproj \
            -target Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -150

      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Unity-iPhone.app"
          ls -la "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/" || true
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
          cd "$GITHUB_WORKSPACE/out"
          zip -qry RedPoker.ipa Payload
          ls -la RedPoker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RedPoker-ipa
          path: out/RedPoker.ipa
          if-no-files-found: error
