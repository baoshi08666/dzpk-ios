name: ios-build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Download project parts
        run: |
          set -e
          EXPECTED=396909461
          BASE="https://github.com/${{ github.repository }}/releases/download/v1"
          rm -rf parts RedPoker_iOS.tar.gz
          mkdir -p parts
          for i in $(seq 0 75); do
            n=$(printf "%03d" $i)
            for attempt in 1 2 3 4 5; do
              curl -sSfL --retry 3 --retry-delay 2 -o "parts/part$n" "$BASE/part$n" && break
              echo "retry part$n ($attempt)"
              sleep 3
            done
            [ -s "parts/part$n" ] || { echo "missing part$n"; exit 1; }
          done
          cat parts/part* > RedPoker_iOS.tar.gz
          size=$(wc -c < RedPoker_iOS.tar.gz | tr -d ' ')
          echo "archive size=$size expected=$EXPECTED"
          [ "$size" -eq "$EXPECTED" ] || { echo "size mismatch"; exit 1; }
          mkdir -p proj
          tar -xzf RedPoker_iOS.tar.gz -C proj
          ls proj | head -30

      - name: Stub out Ntalker plugin (chat disabled)
        run: |
          cat > "$GITHUB_WORKSPACE/proj/Libraries/Plugins/iOS/CallByUnityController.mm" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          extern "C" {
            NSString* _CreateNSString(const char* string) { return string ? [NSString stringWithUTF8String:string] : nil; }
            void _OpenPhotoLibrary() {}
            void _OpenPhotoAblums() {}
            void _OpenCamera() {}
            void CallByUnity(const char *jsonContent) {}
            void IMLogin(const char *userID, const char *token, int appID, const char *systemSender) {}
            void IMLoginOut() {}
            bool StartRecord() { return false; }
            void PlayVoice(const char *path) {}
            void StopVoice() {}
            bool IsPlayingVoice() { return false; }
            void SetVolume(float volume) {}
            void IMSendMessage(const char *str) {}
            void SetConversation(const char *groupId) {}
            void ClearConversation() {}
            int GetImState() { return -1; }
            void ApplyJoinGroup(const char *groupId) {}
            void UpdateShowStatusBar(bool show) {}
            void SaveImageToNative(const void *bytes, long length) {}
            void KeFuInit(const char *siteid, const char *sdkkey) {}
            int KeFuLogin(const char *userId, const char *userName) { return 0; }
            void KeFuLoginOut() {}
            int StartChat(const char *settingid, const char *groupName, const char *strbody) { return 0; }
          }
          EOF
          echo "stubbed"

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/proj"
          xcodebuild -project Unity-iPhone.xcodeproj \
            -target Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            ARCHS=arm64 VALID_ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -200

      - name: Package IPA
        run: |
          set -e
          APP="$GITHUB_WORKSPACE/build/Unity-iPhone.app"
          ls -la "$GITHUB_WORKSPACE/build" || true
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
          cd "$GITHUB_WORKSPACE/out"
          zip -qry RedPoker.ipa Payload
          ls -la RedPoker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RedPoker-ipa
          path: out/RedPoker.ipa
          if-no-files-found: error
